<!doctype html><meta charset="utf-8"><title>curl test</title>
<style>body{margin:0;background:#789;font:12px sans-serif;color:#fff}section{padding:8px}.row{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start}
.cell{position:relative}.cell>div.l{position:absolute;left:2px;top:2px;z-index:2;background:#000a;padding:1px 4px}.box{background:#fff}</style>
<body><div id="out"></div>
<script type="module">
import { PageCurlView, snapshotSlice, curlDuration, commitDecision } from '../web/js/curl.js';
const W = 200, H = 280, hues = [210, 130, 20, 280, 50];
function page(n, w = W, h = H) {
  const c = document.createElement('canvas'); c.width = w * 2; c.height = h * 2; const g = c.getContext('2d'); g.scale(2, 2);
  g.fillStyle = `hsl(${hues[n % 5]},60%,88%)`; g.fillRect(0, 0, w, h);
  g.strokeStyle = '#0003'; for (let y = 20; y < h; y += 20) { g.beginPath(); g.moveTo(10, y); g.lineTo(w - 10, y); g.stroke(); }
  g.strokeStyle = '#000'; g.lineWidth = 3; g.strokeRect(1.5, 1.5, w - 3, h - 3);
  g.fillStyle = '#000'; g.font = 'bold 110px sans-serif'; g.textAlign = 'center'; g.fillText(n, w / 2, h / 2 + 40);
  g.font = 'bold 14px sans-serif'; g.textAlign = 'left'; g.fillText('TOP-LEFT ' + n, 8, 16); g.textAlign = 'right'; g.fillText('BOTTOM-RIGHT', w - 8, h - 8);
  return c;
}
const P = [1, 2, 3, 4].map(n => page(n));
const out = document.getElementById('out');
function cell(row, label, w, h, setup, p, touch) {
  const d = document.createElement('div'); d.className = 'cell'; d.innerHTML = `<div class=l>${label}</div>`;
  const box = document.createElement('div'); box.className = 'box'; box.style.cssText = `width:${w}px;height:${h}px`; d.append(box); row.append(d);
  const v = new PageCurlView(); box.append(v.el); v.resize2(); setup(v); v.setTouch(touch); v.setProgress(p); v.draw(); return v;
}
const ps = [0.1, 0.3, 0.5, 0.7, 0.9];
function section(id, title, cols) {
  const s = document.createElement('section'); s.id = id; s.innerHTML = `<b>${title}</b>`; out.append(s);
  for (const p of ps) { const r = document.createElement('div'); r.className = 'row'; s.append(r); for (const c of cols) cell(r, `${c.n} p=${p} t=${c.t}`, c.w, H, c.setup, p, c.t); }
}
const M = PageCurlView.mirror, B = PageCurlView.paperBack;
const fwd = v => v.setup(null, P[1], P[0], B(M(P[0])), false, 0);
const bwd = v => v.setup(null, M(P[1]), M(P[0]), B(P[0]), true, 0);
section('single', 'single page: forward / backward x touch .9 / .2', [
  { n: 'fwd', t: .9, w: W, setup: fwd }, { n: 'fwd', t: .2, w: W, setup: fwd }, { n: 'bwd', t: .9, w: W, setup: bwd }, { n: 'bwd', t: .2, w: W, setup: bwd }]);
const f2 = v => v.setup(P[0], P[3], P[1], B(M(P[2])), false, .5);
const b2 = v => v.setup(M(P[1]), M(P[2]), M(P[0]), B(P[3]), true, .5);
section('spine', 'two-page spine: forward / backward x touch .9 / .2', [
  { n: 'fwd2', t: .9, w: W * 2, setup: f2 }, { n: 'fwd2', t: .2, w: W * 2, setup: f2 }, { n: 'bwd2', t: .9, w: W * 2, setup: b2 }, { n: 'bwd2', t: .2, w: W * 2, setup: b2 }]);
const sl = snapshotSlice(P[0], 10, 10, 50, 50);
window.__done = { dur: [curlDuration(0, 1), curlDuration(.9, 1), curlDuration(.5, .5)], c: [commitDecision(800, 0), commitDecision(-800, .9), commitDecision(0, .41), commitDecision(0, .3)], slice: [sl.width, sl.height] };
</script>
