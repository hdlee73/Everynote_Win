<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>sync test</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/css/app.css"><link rel="stylesheet" href="/css/library.css"><link rel="stylesheet" href="/css/sync.css">
<style>html,body{margin:0;height:100%}#app{position:fixed;inset:0;background:#F2F2F7}</style>
</head><body><div id="app"></div>
<script type="module">
// In-page fake Google Drive v3 + fake host.google.* (mock of host.call('google.request'))
import { host } from '/js/host.js';
import { prefs } from '/js/prefs.js';
import { LibraryRepository } from '/js/library.js';
import { AnnotationStore, Mark } from '/js/store.js';
import { DriveSync, SIDECAR_SUFFIX } from '/js/sync.js';
import * as UI from '/js/sync-ui.js';

const F = window.F = {
  files: new Map(), seq: 1, sessions: new Map(), requests: [], offline: false, fail: [], status: 'ok',
  google: { configured: false, signedIn: false, email: '', clientId: '' },
  now: () => new Date().toISOString(),
  add(name, parents, mime, bytes, props, mtime) {
    const id = 'f' + (F.seq++); F.files.set(id, { id, name, mimeType: mime, parents, modifiedTime: mtime || F.now(), appProperties: props || {}, bytes: bytes || null, trashed: false }); return id;
  },
  find(name, parentId) { return [...F.files.values()].find(f => f.name === name && f.parents.includes(parentId) && !f.trashed); },
  byPath(p) { let parent = 'root'; let f = null; for (const seg of p.split('/')) { f = F.find(seg, parent); if (!f) return null; parent = f.id; } return f; },
  tree() { const out = []; const walk = (id, pre) => { for (const f of F.files.values()) if (f.parents.includes(id) && !f.trashed) { out.push(pre + f.name + (f.mimeType === 'application/vnd.google-apps.folder' ? '/' : '')); if (f.mimeType.endsWith('folder')) walk(f.id, pre + f.name + '/'); } }; walk('root', ''); return out.sort(); },
  res(f) { return { id: f.id, name: f.name, mimeType: f.mimeType, modifiedTime: f.modifiedTime, size: f.bytes ? String(f.bytes.length) : undefined, appProperties: f.appProperties }; },
  json(o, status = 200, headers = {}) { return { status, headers, text: JSON.stringify(o) }; },
  parseMultipart(a) {
    const ct = Object.entries(a.headers || {}).find(([k]) => k.toLowerCase() === 'content-type')[1]; const boundary = /boundary=(.+)$/.exec(ct)[1];
    let bytes = a.bodyBase64 ? Uint8Array.from(atob(a.bodyBase64), c => c.charCodeAt(0)) : new TextEncoder().encode(a.body);
    const bin = new TextDecoder('latin1').decode(bytes); const delim = '--' + boundary; const i1 = bin.indexOf(delim), i2 = bin.indexOf(delim, i1 + delim.length), i3 = bin.indexOf(delim, i2 + delim.length);
    const part = (s, e) => { const hdrEnd = bin.indexOf('\r\n\r\n', s) + 4; return { head: bin.slice(s, hdrEnd), body: bytes.slice(hdrEnd, e - 2) }; };
    const p1 = part(i1 + delim.length, i2), p2 = part(i2 + delim.length, i3);
    return { meta: JSON.parse(new TextDecoder().decode(p1.body)), media: p2.body };
  },
  apply(meta, media, id) {
    let f;
    if (id) { f = F.files.get(id); if (!f) return F.json({ error: { message: 'not found' } }, 404); if (meta.name) f.name = meta.name; }
    else { f = { id: 'f' + (F.seq++), name: meta.name, mimeType: meta.mimeType, parents: meta.parents || ['root'], appProperties: {}, trashed: false }; F.files.set(f.id, f); }
    f.bytes = media; f.modifiedTime = meta.modifiedTime || F.now(); if (meta.appProperties) f.appProperties = { ...f.appProperties, ...meta.appProperties }; if (meta.mimeType) f.mimeType = meta.mimeType;
    return F.json(F.res(f));
  },
  async handle(a) {
    F.requests.push(a.method + ' ' + a.url.replace('https://www.googleapis.com', ''));
    if (F.offline) throw new Error('net::ERR_INTERNET_DISCONNECTED');
    if (F.onRequest) await F.onRequest(a);
    const fi = F.fail.findIndex(x => !x.match || new RegExp(x.match).test(a.url)); const inj = fi >= 0 ? F.fail.splice(fi, 1)[0] : null; if (inj) return { status: inj.status, headers: {}, text: JSON.stringify({ error: { message: inj.message || 'injected', errors: [{ reason: inj.reason || '' }] } }) };
    if (!F.google.signedIn) return { status: 401, headers: {}, text: '{"error":{"message":"Invalid Credentials"}}' };
    const u = new URL(a.url), p = u.pathname, q = u.searchParams;
    if (u.host === 'upload.fake') { // resumable session PUT
      const s = F.sessions.get(p); const bytes = new Uint8Array(await host.readBytes(a.uploadPath)); F.sessions.delete(p); F.resumed = (F.resumed || 0) + 1;
      return F.apply(s.meta, bytes, s.id);
    }
    const mUp = /^\/upload\/drive\/v3\/files(?:\/([^/]+))?$/.exec(p);
    if (mUp) {
      if (q.get('uploadType') === 'resumable') { const sid = '/session/' + (F.seq++); F.sessions.set(sid, { meta: JSON.parse(a.body), id: mUp[1] || null }); return { status: 200, headers: { Location: 'https://upload.fake' + sid }, text: '' }; }
      const { meta, media } = F.parseMultipart(a); return F.apply(meta, media, mUp[1] || null);
    }
    const mf = /^\/drive\/v3\/files(?:\/([^/]+?))?(\/copy)?$/.exec(p);
    if (!mf) return { status: 404, headers: {}, text: '{"error":{"message":"bad path"}}' };
    const id = mf[1];
    if (!id && a.method === 'GET') {
      const qs = q.get('q') || ''; let list = [...F.files.values()].filter(f => !f.trashed);
      let m;
      if ((m = /^'([^']+)' in parents and trashed=false$/.exec(qs))) list = list.filter(f => f.parents.includes(m[1]));
      else if ((m = /^name='(.*)' and 'root' in parents and mimeType='([^']+)' and trashed=false$/.exec(qs))) list = list.filter(f => f.name === m[1].replace(/\\'/g, "'") && f.parents.includes('root') && f.mimeType === m[2]);
      return F.json({ files: list.map(F.res) });
    }
    if (!id && a.method === 'POST') { const m = JSON.parse(a.body); const f = F.add(m.name, m.parents || ['root'], m.mimeType, null, {}); return F.json(F.res(F.files.get(f))); }
    const f = F.files.get(id); if (!f) return { status: 404, headers: {}, text: '{"error":{"message":"File not found"}}' };
    if (mf[2]) { const m = JSON.parse(a.body); const c = F.add(m.name, m.parents || f.parents, f.mimeType, f.bytes, { ...f.appProperties }, f.modifiedTime); return F.json(F.res(F.files.get(c))); }
    if (a.method === 'PATCH') { const m = JSON.parse(a.body); if (m.trashed != null) f.trashed = m.trashed; return F.json(F.res(f)); }
    if (q.get('alt') === 'media') {
      if (a.savePath) { host._fake.put(a.savePath, f.bytes); return { status: 200, headers: {}, savedPath: a.savePath }; }
      return { status: 200, headers: {}, text: new TextDecoder().decode(f.bytes) };
    }
    return F.json({ id: f.id, trashed: f.trashed });
  },
};
const origCall = host.call.bind(host);
host.call = async (m, a) => {
  if (!m.startsWith('google.')) return origCall(m, a);
  const g = F.google;
  switch (m) {
    case 'google.config': g.clientId = a.clientId; g.configured = !!(a.clientId && a.clientSecret); return true;
    case 'google.status': return { signedIn: g.signedIn, email: g.email, configured: g.configured };
    case 'google.signIn': if (F.offline) throw new Error('net::ERR_INTERNET_DISCONNECTED'); if (!g.configured) throw new Error('OAuth 클라이언트가 설정되지 않았습니다'); g.signedIn = true; g.email = F.nextEmail || 'tester@example.com'; return { email: g.email };
    case 'google.signOut': g.signedIn = false; g.email = ''; return true;
    case 'google.request': return F.handle(a);
  }
  throw new Error('unknown host method ' + m);
};

const lib = new LibraryRepository(); await lib.ready;
const app = { library: lib, recentPrefs: prefs, documentUri: null, store: null };
window.T = { host, prefs, lib, app, AnnotationStore, Mark, DriveSync, UI, SIDECAR_SUFFIX };
window.READY = true;
</script></body></html>
