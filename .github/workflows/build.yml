name: Build & Release

on:
  push:
    branches: [main, host-dev]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      test_libreoffice:
        description: 'Install LibreOffice on the runner and smoke-test docx -> PDF conversion'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Offline HWP/HWPX -> PDF engine (rhwptopdf WASM), same pinned source and patch as the Android app.
  hwp-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: sanguneo/rhwptopdf
          ref: adbc4bf0f5c6e041ed65b0dbc8aa6b810990a48b
          path: .hwp-engine-source
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .hwp-engine-source
      - uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: 'v0.13.1'
      - name: Korean TTC regression font
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Test and build offline HWP engine
        env:
          PDFNOTE_TEST_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
        run: |
          set -o pipefail
          python3 tools/prepare_hwp_engine.py --out web/hwp 2>&1 | tee engine.log || {
            grep -E "error(\[|:)|panicked|FAILED|failed" engine.log | head -8 | while read -r l; do echo "::error title=hwp-engine::${l:0:400}"; done
            exit 1; }
          ls -l web/hwp
          echo "::notice title=hwp-engine::built $(stat -c %s web/hwp/rhwptopdf.umd.js) + $(stat -c %s web/hwp/rhwptopdf.umd_bg.wasm) bytes"
      - uses: actions/upload-artifact@v4
        with:
          name: hwp-engine
          path: |
            web/hwp/rhwptopdf.umd.js
            web/hwp/rhwptopdf.umd_bg.wasm
          if-no-files-found: error

  build:
    needs: hwp-engine
    if: ${{ !cancelled() }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch HWP engine
        id: engine
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: hwp-engine
          path: web/hwp
      - name: Check HWP engine
        shell: pwsh
        run: |
          if ((Test-Path web/hwp/rhwptopdf.umd.js) -and (Test-Path web/hwp/rhwptopdf.umd_bg.wasm)) {
            Write-Host "::notice title=hwp-engine::embedded $([int]((Get-Item web/hwp/rhwptopdf.umd_bg.wasm).Length/1KB)) KB wasm"
          } elseif ("${{ github.ref }}" -like "refs/tags/*") {
            Write-Host "::error title=hwp-engine::engine missing on a release build"; exit 1
          } else {
            Write-Host "::warning title=hwp-engine::engine missing: HWP conversion unavailable in this build"
          }

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = '2.0.0'
          if ("${{ github.ref }}" -like "refs/tags/v*") { $v = "${{ github.ref_name }}".TrimStart('v') }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore host/PDFNote.csproj -r win-x64 2>&1 | Tee-Object -FilePath restore.log
          if ($LASTEXITCODE -ne 0) {
            (Get-Content restore.log | Where-Object { $_ -match 'error' } | Select-Object -Unique -First 8) | ForEach-Object { Write-Host "::error title=restore::$($_.Trim() -replace '%','%25')" }
            exit 1
          }

      - name: Publish win-x64 (self-contained, single file)
        shell: pwsh
        run: |
          dotnet publish host/PDFNote.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishReadyToRun=true -p:Version=${{ steps.ver.outputs.version }} -o out/x64 2>&1 | Tee-Object -FilePath build-x64.log
          if ($LASTEXITCODE -ne 0) {
            (Get-Content build-x64.log | Where-Object { $_ -match ': error ' } | ForEach-Object { $_.Trim() -replace '^.*?host[\\/]','' } | Select-Object -Unique -First 10) | ForEach-Object { Write-Host "::error title=build-x64::$($_ -replace '%','%25')" }
            exit 1
          }
          Write-Host "::notice title=build-x64::exe $([int]((Get-Item out/x64/PDFNote.exe).Length/1MB)) MB"
          (Get-Content build-x64.log | Where-Object { $_ -match ': warning ' } | ForEach-Object { $_.Trim() -replace '^.*?host[\\/]','' } | Select-Object -Unique -First 5) | ForEach-Object { Write-Host "::warning title=build-warn::$($_ -replace '%','%25')" }

      - name: Publish win-arm64 (self-contained, single file)
        shell: pwsh
        run: |
          dotnet publish host/PDFNote.csproj -c Release -r win-arm64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishReadyToRun=true -p:Version=${{ steps.ver.outputs.version }} -o out/arm64 2>&1 | Tee-Object -FilePath build-arm64.log
          if ($LASTEXITCODE -ne 0) {
            (Get-Content build-arm64.log | Where-Object { $_ -match ': error ' } | ForEach-Object { $_.Trim() -replace '^.*?host[\\/]','' } | Select-Object -Unique -First 10) | ForEach-Object { Write-Host "::error title=build-arm64::$($_ -replace '%','%25')" }
            exit 1
          }

      - name: Prepare LibreOffice + docx (optional)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_libreoffice }}
        shell: pwsh
        run: |
          choco install libreoffice-fresh -y --no-progress | Select-Object -Last 3
          $docx = Join-Path ([IO.Path]::GetTempPath()) 'smoke.docx'
          python tools/make_sample_docx.py $docx
          "SMOKE_DOCX=$docx" >> $env:GITHUB_ENV

      - name: Smoke test (launch, open sample PDF, host protocol checks, screenshot)
        shell: pwsh
        run: |
          ./tools/smoke.ps1 -Exe "$PWD\out\x64\PDFNote.exe" -Pdf "$PWD\dev\samples\sample-ko.pdf" -Out smoke -Docx "$env:SMOKE_DOCX"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: smoke/*
          if-no-files-found: ignore

      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $v = "${{ github.ref_name }}"
          if (-not ("${{ github.ref }}" -like "refs/tags/*")) { $v = "dev" }
          Copy-Item out/x64/PDFNote.exe "dist/PDFNote-$v-win-x64.exe"
          Copy-Item out/arm64/PDFNote.exe "dist/PDFNote-$v-win-arm64.exe"
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: PDFNote-windows
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = "docs/release-notes/$tag.md"
          $files = Get-ChildItem dist | ForEach-Object { $_.FullName }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
            if (Test-Path $notes) { gh release edit $tag --notes-file $notes --title "PDF Note for Windows $tag" }
          } elseif (Test-Path $notes) {
            gh release create $tag @files --title "PDF Note for Windows $tag" --notes-file $notes --target $env:GITHUB_SHA
          } else {
            gh release create $tag @files --title "PDF Note for Windows $tag" --generate-notes --target $env:GITHUB_SHA
          }
