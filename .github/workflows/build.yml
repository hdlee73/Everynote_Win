name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore src/PDFNote.csproj

      - name: Publish win-x64 (self-contained, single file)
        run: >
          dotnet publish src/PDFNote.csproj -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:PublishReadyToRun=true
          -o out/x64

      - name: Publish win-arm64 (self-contained, single file)
        run: >
          dotnet publish src/PDFNote.csproj -c Release -r win-arm64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:PublishReadyToRun=true
          -o out/arm64

      - name: Publish win-x64 (framework-dependent, small)
        run: >
          dotnet publish src/PDFNote.csproj -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -o out/fd

      - name: Smoke test (launch app, open sample PDF, screenshot)
        continue-on-error: true
        shell: pwsh
        run: |
          python tools/make_sample_pdf.py "$PWD\sample.pdf"
          $p = Start-Process -FilePath "$PWD\out\x64\PDFNote.exe" -ArgumentList "`"$PWD\sample.pdf`"" -PassThru
          Start-Sleep -Seconds 30
          $p.Refresh()
          $failed = $false
          if ($p.HasExited) {
            Write-Host "::error title=smoke::APP EXITED with code $($p.ExitCode)"
            $failed = $true
          } else {
            Write-Host "::notice title=smoke::APP RUNNING title='$($p.MainWindowTitle)' ws=$([int]($p.WorkingSet64/1MB))MB private=$([int]($p.PrivateMemorySize64/1MB))MB threads=$($p.Threads.Count) responding=$($p.Responding)"
          }
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          $bmp.Save("$PWD\smoke\screenshot.png")
          # crude visual check: fraction of non-uniform pixels in the screenshot (blank screen => ~0)
          $small = New-Object System.Drawing.Bitmap $bmp, 64, 36
          $set = New-Object System.Collections.Generic.HashSet[int]
          for ($x=0;$x -lt 64;$x++){ for($y=0;$y -lt 36;$y++){ [void]$set.Add($small.GetPixel($x,$y).ToArgb()) } }
          Write-Host "::notice title=smoke-screen::distinct colors in 64x36 thumbnail: $($set.Count) screen=$($b.Width)x$($b.Height)"
          $log = Join-Path $env:APPDATA "PDFNote\\log.txt"
          if (Test-Path $log) {
            $txt = (Get-Content $log -Raw)
            if ($txt.Length -gt 3000) { $txt = $txt.Substring(0,3000) }
            $enc = $txt -replace '%','%25' -replace "`r",'%0D' -replace "`n",'%0A'
            Write-Host "::error title=smoke-applog::$enc"
          } else { Write-Host "::notice title=smoke-applog::no app log (no handled/unhandled errors)" }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          if ($failed) { exit 1 }

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: smoke/*
          if-no-files-found: ignore

      - name: Collect release files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $v = "${{ github.ref_name }}"
          if (-not ("${{ github.ref }}" -like "refs/tags/*")) { $v = "dev" }
          Copy-Item out/x64/PDFNote.exe "dist/PDFNote-$v-win-x64.exe"
          Copy-Item out/arm64/PDFNote.exe "dist/PDFNote-$v-win-arm64.exe"
          Copy-Item out/fd/PDFNote.exe "dist/PDFNote-$v-win-x64-lite(needs-.NET8-Desktop-Runtime).exe"
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: PDFNote-windows
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $notes = "docs/release-notes/$tag.md"
          $files = Get-ChildItem dist | ForEach-Object { $_.FullName }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @files --clobber
            if (Test-Path $notes) { gh release edit $tag --title "PDF Note for Windows $tag" --notes-file $notes }
          } elseif (Test-Path $notes) {
            gh release create $tag @files --title "PDF Note for Windows $tag" --notes-file $notes
          } else {
            gh release create $tag @files --title "PDF Note for Windows $tag" --generate-notes
          }
