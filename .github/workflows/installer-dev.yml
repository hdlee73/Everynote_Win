name: installer-dev (temporary quick loop)
on:
  push:
    branches: [host-v3]
    paths: ['installer/**', 'tools/installer-smoke.ps1', '.github/workflows/installer-dev.yml']
jobs:
  quick:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '8.0.x' }
      - name: Publish x64 (no R2R)
        shell: pwsh
        run: |
          dotnet publish host/Everynote.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:Version=3.0.0 -o out/x64 2>&1 | Select-Object -Last 3
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress | Select-Object -Last 2
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          & $iscc "/DAppVersion=3.0.0" "/DArch=x64" "/DSourceExe=..\out\x64\Everynote.exe" "/DOutputBase=Everynote-Setup-vdev-x64" "/DOutDir=..\dist" installer\Everynote.iss | Select-Object -Last 5
          ./tools/installer-smoke.ps1 -Setup "$PWD\dist\Everynote-Setup-vdev-x64.exe" -Out installer-smoke
