<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="256" height="256">
  <title>Everynote</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5AC8FA"/>
      <stop offset="1" stop-color="#0A6CFF"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.38"/>
      <stop offset="0.6" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EAF3FF"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F9FF"/>
      <stop offset="1" stop-color="#B9D6FF"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE2B0"/>
      <stop offset="1" stop-color="#E9B26A"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE14D"/>
      <stop offset="0.55" stop-color="#FFCC00"/>
      <stop offset="1" stop-color="#E0A800"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2F2F7"/>
      <stop offset="0.5" stop-color="#B8BCC6"/>
      <stop offset="1" stop-color="#8E93A0"/>
    </linearGradient>
    <linearGradient id="eraser" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF6B60"/>
      <stop offset="1" stop-color="#E02A20"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <clipPath id="tile"><rect x="2" y="2" width="104" height="104" rx="24"/></clipPath>
  </defs>
  <!-- tile -->
  <rect x="2" y="2" width="104" height="104" rx="24" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <rect x="2" y="2" width="104" height="104" fill="url(#glow)"/>
    <rect x="2" y="2" width="104" height="104" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1"/>
  </g>
  <!-- page shadow -->
  <path d="M34,31h28l14,14v41a5,5 0 0,1 -5,5H34a5,5 0 0,1 -5,-5V36a5,5 0 0,1 5,-5z" fill="#00205E" opacity="0.32" filter="url(#soft)"/>
  <!-- page -->
  <path d="M34,26h27l15,15v40a5,5 0 0,1 -5,5H34a5,5 0 0,1 -5,-5V31a5,5 0 0,1 5,-5z" fill="url(#paper)"/>
  <!-- folded corner -->
  <path d="M61,26v10a5,5 0 0,0 5,5h10z" fill="url(#fold)"/>
  <path d="M61,26v10a5,5 0 0,0 5,5h10" fill="none" stroke="#8FBAF5" stroke-opacity="0.5" stroke-width="0.6"/>
  <!-- text lines -->
  <g fill="#9CC4FF">
    <rect x="37" y="49" width="26" height="4.4" rx="2.2"/>
    <rect x="37" y="58" width="20" height="4.4" rx="2.2"/>
    <rect x="37" y="67" width="11" height="4.4" rx="2.2"/>
  </g>
  <!-- pencil shadow -->
  <g transform="translate(55.2,84) rotate(-45)" opacity="0.28" filter="url(#soft)">
    <path d="M0,0 L10,-5.4 H38 a3,3 0 0,1 0,10.8 H10 z" fill="#00205E"/>
  </g>
  <!-- pencil: tip at (54,82), axis up-right -->
  <g transform="translate(54,82) rotate(-45)">
    <path d="M0,0 L10,-5 V5 z" fill="url(#wood)"/>
    <path d="M0,0 L3.6,-1.8 V1.8 z" fill="#1C1C1E"/>
    <path d="M10,-5 H27 V5 H10 z" fill="url(#body)"/>
    <path d="M10,-5 H27 V-2.6 H10 z" fill="#FFF3A6" opacity="0.55"/>
    <path d="M10,3 H27 V5 H10 z" fill="#B88400" opacity="0.35"/>
    <path d="M27,-5 H31 V5 H27 z" fill="url(#metal)"/>
    <path d="M28.6,-5 V5 M30,-5 V5" stroke="#6E7380" stroke-width="0.5" opacity="0.7"/>
    <path d="M31,-5 H35.5 a2.5,2.5 0 0,1 2.5,2.5 V2.5 a2.5,2.5 0 0,1 -2.5,2.5 H31 z" fill="url(#eraser)"/>
  </g>
</svg>
